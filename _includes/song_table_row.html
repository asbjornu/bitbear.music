<tr>
  <td class="r date">
    <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{% date post.date, format: '%B {day}' %}</time>
  </td>
  {% if include.album %}
    <td class="kind">{{ post.album.kind | default: 'Track' }}</td>
  {% else %}
    <td class="format">{{ post.media.format }}</td>
  {% endif %}
  <td><a href="{{ post.url }}">{{ post.title }}</a></td>
</tr>
