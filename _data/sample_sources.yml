# Sample sources credited on music posts.
#
# Posts reference these entries from front matter, e.g.
#
#   sample_sources:
#     - source: 2nd-reality
#       evidence: "Exact sample matches: KettleDrum.5.Traditional, ..."
#
# Keep this file as the single place for a source's title, author, group and
# link. Prefer Demozoo links where a matching music, scener or group entry
# exists. The per-post `evidence` explains why that source is credited on that
# track.

