name: build

on:
  workflow_call:
    inputs:
      production:
        description: >-
          Build with JEKYLL_ENV=production, so Git LFS-tracked binaries (e.g.
          remix-kit archives) are linked via media.githubusercontent.com
          instead of being included in the deployment artifact.
        type: boolean
        default: false

env:
  RUBY_VERSION: 4.0.5
  RUBYGEMS_VERSION: 4.0.11

concurrency:
  group: jekyll-build
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: ${{ inputs.production }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          rubygems: ${{ env.RUBYGEMS_VERSION }}
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: install html tidy
        run: sudo apt-get update && sudo apt-get install -y tidy

      - name: jekyll build
        env:
          JEKYLL_ENV: ${{ inputs.production && 'production' || 'development' }}
        run: bundle exec rake build

      - name: remove remix-kit archives from production site
        if: ${{ inputs.production }}
        run: rm -rf _site/assets/remix-kits

      - name: upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
