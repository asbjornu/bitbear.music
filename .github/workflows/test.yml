name: test

# Files listed under paths-ignore are neither built by Jekyll (see the
# `exclude` list in _config.yml) nor exercised by the test suite, so changes
# limited to them don't need a full test/build run.
on:
  push:
    paths-ignore: &non_build_paths
      - AGENTS.md
      - readme.md
      - README.md
      - CODE_OF_CONDUCT.md
      - LICENSE
      - LICENSE-CONTENT
      - LICENSE.txt
      - .editorconfig
      - .gitattributes
      - .gitignore
  pull_request:
    paths-ignore: *non_build_paths

permissions:
  contents: read
  packages: read

env:
  RUBY_VERSION: 4.0.5
  RUBYGEMS_VERSION: 4.0.11

jobs:
  build:
    uses: ./.github/workflows/_build.yml

  htmlproofer:
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: htmlproofer
      queue: max
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      - name: htmlproofer cache
        uses: actions/cache@v6
        with:
          path: tmp/.htmlproofer
          key: ${{ runner.os }}-htmlproofer

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          rubygems: ${{ env.RUBYGEMS_VERSION }}
          bundler-cache: true

      - name: htmlproofer
        run: bundle exec rake htmlproofer

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          rubygems: ${{ env.RUBYGEMS_VERSION }}
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: markdown lint
        run: npm run lint:markdown

      - name: rspec
        run: bundle exec rake spec

      - name: codecov upload
        uses: codecov/codecov-action@v7
        with:
          files: coverage/.resultset.json
          fail_ci_if_error: false

      - name: rubocop
        run: bundle exec rubocop --fail-level warning --display-only-fail-level-offenses
