markdown: kramdown
permalink: /:categories/:title
excerpt_separator: <!--more-->
url: https://bitbear.music

# Used by the lfs_media_url filter (_plugins/liquid_filters.rb) to build
# media.githubusercontent.com URLs for Git LFS-tracked files, so that large
# binaries (e.g. remix-kit archives) don't have to be included in the
# GitHub Pages deployment artifact, which is capped at 1 GB.
repository: asbjornu/bitbear.music
repository_branch: main

plugins:
  - jekyll-sitemap
  - jekyll-feed

collections:
  remix_kits:
    output: true
    permalink: /music/:title/remix-kit/

author:
  name: Asbjørn Ulsberg
  email: mail@bitbear.music

defaults:
  - values:
      layout: default
      description: |
        bitbear.music is the website of electronic music producer Asbjørn Ulsberg
  - scope:
      path: music/albums
    values:
      layout: album
  - scope:
      path: music/genres
    values:
      layout: tag
  - scope:
      path: music/formats
    values:
      layout: format
  - scope:
      path: music
    values:
      layout: post

sass:
  sass_dir: assets/scss
  style: compressed
  sourcemap: never
  silence_deprecations:
    - if-function
  load_paths:
    - node_modules/@picocss/pico/scss

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - LICENSE-CONTENT
  - LICENSE.txt
  - CODE_OF_CONDUCT.md
  - readme.md
  - .DS_Store
  - .gitignore
  - spec
  - Rakefile
  - coverage
  - covers-master
  - package.json
  - package-lock.json
